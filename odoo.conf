[options]
; =============================================================================
;                         ODOO 19 MASTER CONFIGURATION
; =============================================================================

; -----------------------------------------------------------------------------
; 1. GENERAL & SERVER
; -----------------------------------------------------------------------------
http_interface = 127.0.0.1
http_port = 8019
proxy_mode = True
server_wide_modules = base,web

; -----------------------------------------------------------------------------
; 2. DATABASE CONNECTION (Routing through PgBouncer on port 6432)
; -----------------------------------------------------------------------------
db_host = 127.0.0.1
db_port = 6432
db_user = odoo19
db_password = 999239
db_name = False
db_maxconn = 64
db_sslmode = prefer
dbfilter = ^.*$
db_template = template0
unaccent = False

; -----------------------------------------------------------------------------
; 3. ADDONS PATHS & FILE STORAGE
; -----------------------------------------------------------------------------
; Core Odoo addons + OCA + l10_ir + your custom er1376 folder
addons_path = /home/odoo19/odoo19/odoo/addons,/home/odoo19/odoo19/custom_addons/OCA,/home/odoo19/odoo19/custom_addons/l10_ir,/home/odoo19/odoo19/custom_addons/er1376
data_dir = /home/odoo19/odoo19/filestore

; -----------------------------------------------------------------------------
; 4. SECURITY & MASTER PASSWORD
; -----------------------------------------------------------------------------
admin_passwd = 999239
list_db = True

; -----------------------------------------------------------------------------
; 5. LOGGING & MONITORING
; -----------------------------------------------------------------------------
logfile = /home/odoo19/odoo19/logs/odoo.log
log_level = info
log_handler = :INFO

; -----------------------------------------------------------------------------
; 6. PERFORMANCE & WORKER PROCESSES
; -----------------------------------------------------------------------------
workers = 4
max_cron_threads = 2
limit_memory_soft = 2147483648
limit_memory_hard = 2684354560
limit_time_cpu = 60
limit_time_real = 120
limit_request = 1073741824

; -----------------------------------------------------------------------------
; 7. CACHING & SESSIONS (Redis Integration)
; -----------------------------------------------------------------------------
; Requires OCA session_redis module. Commented out to avoid warnings.
; session_redis = True
; session_redis_host = 127.0.0.1
; session_redis_port = 6379
; session_redis_db = 1

; -----------------------------------------------------------------------------
; 8. DEVELOPER / DEBUG / TESTING OPTIONS
; -----------------------------------------------------------------------------
dev_mode = False
demo = False
